device_rules:
  - conditions:
      any:
        - $name contains Logitech
    ignore: true
touchpad:
  speed:
    swipe_threshold: 45
  gestures:
    - type: swipe
      fingers: 3
      direction: down
      actions:
        - on: begin
          plasma_shortcut: kwin,Window Maximize
          conditions:
            - $window_maximized
            - !$window_fullscreen
        - on: begin
          plasma_shortcut: kwin,Window Fullscreen
          conditions:
            - $window_fullscreen
        - on: begin
          plasma_shortcut: kwin,Window Minimize
          conditions:
            - none:
                - $window_fullscreen
                - $window_maximized
    - type: swipe
      fingers: 3
      direction: up
      actions:
        - on: begin
          plasma_shortcut: kwin,Window Maximize
          conditions:
            - !$window_maximized
        - on: begin
          plasma_shortcut: kwin,Window Fullscreen
          conditions:
            - any:
                - $window_maximized
                - $window_fullscreen
    - type: pinch
      fingers: 3
      direction: in
      actions:
        - on: begin
          plasma_shortcut: kwin,Window Close
    - type: swipe
      direction: left_right
      fingers: 3
      actions:
        - on: begin
          input:
            - keyboard:
                - +leftalt
                - tab
        - on: update
          interval: -120
          input:
            - keyboard:
                - leftshift+tab
        - on: update
          interval: 120
          input:
            - keyboard:
                - tab
        - on: end_cancel
          input:
            - keyboard:
                - -leftalt
